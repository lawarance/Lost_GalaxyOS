# ✦ Lost Galaxy — Starship prompt (pwsh + git bash) · connected pill
# location: ~\.config\starship.toml
#
# one bar:  ( ✦ | ~/dotfiles | main ! | 3.12 | 09:54 )
# caps:   start   end/transition   thin divider
# pixel style -> replace  with  and  with  (and  with )

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "lost_galaxy"

format = """
[](fg:mauve)[ ✦ ](bg:mauve fg:crust bold)[](fg:mauve bg:surface0)\
$directory\
$git_branch\
$git_status\
$python\
$java\
$c\
$nodejs\
$rust\
$cmd_duration\
$time\
[](fg:surface0)\
$line_break\
$character"""

[palettes.lost_galaxy]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

[character]
success_symbol = "[❯](bold mauve)"
error_symbol   = "[❯](bold red)"
vimcmd_symbol  = "[❮](bold sky)"

[directory]
truncation_length = 3
truncate_to_repo = true
truncation_symbol = "…/"
home_symbol = "~"
read_only = " 󰌾"
format = "[ $path$read_only ](bg:surface0 fg:pink bold)"

[git_branch]
symbol = " "
format = "[](bg:surface0 fg:overlay0)[ $symbol$branch ](bg:surface0 fg:lavender)"

[git_status]
format = '([$all_status$ahead_behind ](bg:surface0 fg:peach))'

[python]
symbol = " "
format = '[](bg:surface0 fg:overlay0)[ $symbol($version)(\($virtualenv\)) ](bg:surface0 fg:yellow)'

[java]
symbol = " "
format = "[](bg:surface0 fg:overlay0)[ $symbol($version) ](bg:surface0 fg:peach)"

[c]
symbol = " "
format = "[](bg:surface0 fg:overlay0)[ $symbol($version) ](bg:surface0 fg:blue)"

[nodejs]
symbol = "󰎙 "
format = "[](bg:surface0 fg:overlay0)[ $symbol($version) ](bg:surface0 fg:green)"

[rust]
symbol = "󱘗 "
format = "[](bg:surface0 fg:overlay0)[ $symbol($version) ](bg:surface0 fg:maroon)"

[cmd_duration]
min_time = 2000
format = "[](bg:surface0 fg:overlay0)[ 󱦟 $duration ](bg:surface0 fg:overlay2)"

[time]
disabled = false
time_format = "%H:%M"
format = "[](bg:surface0 fg:overlay0)[ 󰥔 $time ](bg:surface0 fg:sky)"
