# ✦ Lost Galaxy — yazi
# location: %APPDATA%\yazi\config\yazi.toml

[mgr]
ratio          = [1, 3, 4]      # parent · current · preview
sort_by        = "natural"
sort_dir_first = true
show_hidden    = true
show_symlink   = true
linemode       = "size"
scrolloff      = 5

[preview]
wrap     = "no"
tab_size = 2

[opener]
edit = [
  { run = 'code "%*"', orphan = true, desc = "VS Code", for = "windows" },
  { run = 'nvim "%*"', block = true,  desc = "Neovim",  for = "windows" },
]
