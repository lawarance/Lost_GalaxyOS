# ✦ Lost Galaxy — yazi keys (added on top of the defaults)
# location: %APPDATA%\yazi\config\keymap.toml
# press ~ inside yazi to see every key

# ─── quick jumps: g + letter ───
[[mgr.prepend_keymap]]
on = ["g", "d"]
run = "cd ~/dotfiles"
desc = "Go to dotfiles"

[[mgr.prepend_keymap]]
on = ["g", "l"]
run = "cd ~/Desktop/Lawarance"
desc = "Go to Lawarance"

[[mgr.prepend_keymap]]
on = ["g", "n"]
run = "cd ~/Desktop/Lawarance/Notes"
desc = "Go to Notes"

[[mgr.prepend_keymap]]
on = ["g", "D"]
run = "cd ~/Downloads"
desc = "Go to Downloads"

[[mgr.prepend_keymap]]
on = ["g", "c"]
run = "cd ~/.config"
desc = "Go to .config"

[[mgr.prepend_keymap]]
on = ["g", "a"]
run = "cd ~/AppData/Roaming"
desc = "Go to AppData"

# ─── open current folder in explorer / vs code ───
[[mgr.prepend_keymap]]
on = ["g", "e"]
run = 'shell "explorer ." --orphan'
desc = "Open folder in Explorer"

[[mgr.prepend_keymap]]
on = ["g", "v"]
run = 'shell "code ." --orphan'
desc = "Open folder in VS Code"
